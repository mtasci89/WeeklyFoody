name: Foody Android assistant checks
on:
  pull_request:
    branches: ['claude/weeklyfood-bot-review-08wbec']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  android:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: mkdir -p out/screens
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
        working-directory: android
        env:
          GORUNTU: ${{ github.workspace }}/out/screens
      - run: cp android/app/build/outputs/apk/release/app-release.apk out/foody-1.10.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foody-1.10
          path: |
            out/
            android/app/build/reports/tests/
